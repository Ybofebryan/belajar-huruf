<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ayo Belajar Huruf & Angka!</title>
<meta name="description" content="Game anak untuk belajar menulis huruf besar, huruf kecil, angka, dan menyusun kata dalam Bahasa Indonesia.">
<meta name="theme-color" content="#f7e6d2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Belajar Huruf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7e6d2;--ink:#5a3a22;--tw:46px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#fbefe1 0%,var(--bg) 70%)}
.bunting{height:24px;flex:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='24'><path d='M0 2 H130' stroke='%23c9a27c' stroke-width='1.5'/><polygon points='2,2 22,2 12,19' fill='%23e8665a'/><polygon points='28,2 48,2 38,19' fill='%23f2b134'/><polygon points='54,2 74,2 64,19' fill='%2367b96a'/><polygon points='80,2 100,2 90,19' fill='%235aa9e6'/><polygon points='106,2 126,2 116,19' fill='%23b07ad9'/></svg>") repeat-x}
.grass{height:20px;flex:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='20'><path d='M0 20 Q4 6 8 13 Q12 2 17 12 Q22 4 26 13 Q31 3 35 12 Q40 5 44 13 Q49 2 53 12 Q57 6 60 13 V20Z' fill='%2389c26c'/><path d='M0 20 Q6 12 12 16 Q20 10 28 16 Q36 11 44 16 Q52 11 60 16 V20Z' fill='%236faa55'/></svg>") repeat-x bottom}
.screen{display:none;flex:1;min-height:0;flex-direction:column;position:relative}
.screen.active{display:flex}
.topbar{display:flex;gap:10px;padding:6px 14px 0;align-items:center;flex:none;z-index:3}
.rbtn{width:48px;height:48px;border-radius:50%;background:#fff;border:none;box-shadow:0 3px 0 #e2c9ad,0 4px 10px rgba(90,58,34,.15);display:grid;place-items:center;padding:0;transition:transform .1s}
.rbtn:active{transform:translateY(2px) scale(.95)}
.rbtn svg{width:26px;height:26px}
.spacer{flex:1}
.balloon{position:absolute;width:26px;height:32px;border-radius:50% 50% 48% 48%;opacity:.35;pointer-events:none;animation:floaty 7s ease-in-out infinite}
.balloon:after{content:'';position:absolute;left:50%;top:100%;width:1px;height:26px;background:rgba(90,58,34,.4)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(4deg)}}

/* HOME */
#home{align-items:center;justify-content:center;gap:3vh;padding:10px 20px}
.title{font-size:clamp(30px,8.5vw,54px);font-weight:700;text-align:center;line-height:1.05;margin:0}
.title span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cards{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(92vw,560px)}
.mcard{width:100%;border:none;border-radius:28px;padding:10px 10px 0;box-shadow:0 8px 0 rgba(0,0,0,.15);transition:transform .12s;background:var(--c)}
.mcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mcard .inner{background:#fff;border-radius:20px;height:clamp(84px,17vh,170px);display:flex;align-items:center;justify-content:center;gap:4px}
.mcard .inner b{font-size:clamp(36px,10.5vw,76px);font-weight:700;line-height:1;display:inline-block;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.mcard .lbl{color:#fff;font-size:clamp(15px,4.4vw,22px);font-weight:700;padding:6px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.mascot{font-size:44px;position:absolute;bottom:26px;right:18px;animation:bob 2s ease-in-out infinite}

/* TRACE */
.trace-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 10px 6px}
.stage{flex:1;min-height:0;width:100%;position:relative;display:flex;align-items:center;justify-content:center}
#tsvg{width:100%;height:100%;touch-action:none;overflow:visible}
.hintpill{pointer-events:none;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:#fff;padding:6px 14px;border-radius:20px;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(90,58,34,.12);white-space:nowrap;transition:opacity .3s}
.outline{fill:none;stroke:#c9a27c;stroke-width:21;stroke-linecap:round;stroke-linejoin:round}
.body{fill:none;stroke:#efd8bd;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:none;stroke-width:17.5;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:#fff;stroke:#b98d66;stroke-width:.8}
.guide circle.ring{fill:#fff;stroke-width:3.2}
.guide .pulse{fill:none;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-out infinite}
.guide text{font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.arrow{opacity:.55}
.letterG{transform-box:fill-box;transform-origin:50% 60%}
.done .letterG{animation:joy .7s ease}
@keyframes joy{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}55%{transform:scale(.94,1.08)}80%{transform:scale(1.03)}100%{transform:scale(1)}}
.face{transform-box:fill-box;transform-origin:center;animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.face .lid{transform-box:fill-box;transform-origin:center;animation:blink 3.2s infinite}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bunny{position:absolute;left:4px;bottom:4px;font-size:46px;transform:translateY(120%);transition:transform .5s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.bunny.show{transform:translateY(0)}

.grid{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:calc(var(--tw)*7 + 36px);padding-top:6px}
.tile{width:var(--tw);height:var(--tw);border-radius:12px;background:#fff;border:3.5px solid var(--c);color:var(--c);font-size:calc(var(--tw)*.6);font-weight:700;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--c);position:relative;transition:transform .12s;line-height:1}
.tile:active{transform:translateY(2px)}
.tile.cur{transform:translateY(-5px) scale(1.06);box-shadow:0 6px 0 var(--c),0 8px 14px rgba(0,0,0,.18)}
.tile[data-stars]:not([data-stars=''])::after{content:attr(data-stars);position:absolute;top:-10px;right:-8px;font-size:12px;letter-spacing:-2px;color:#f5b301;text-shadow:0 1px 0 #b77d00;background:#fff;border-radius:8px;padding:0 3px 0 1px;line-height:15px}
.levels{display:flex;gap:4px;background:#fff;padding:4px;border-radius:26px;box-shadow:0 3px 0 #e2c9ad,0 4px 10px rgba(90,58,34,.12)}
.lvl{border:none;background:transparent;height:40px;min-width:46px;border-radius:20px;padding:0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c9a27c;line-height:1;transition:background .15s}
.lvl b{font-size:16px;font-weight:700}.lvl i{font-style:normal;font-size:9px;letter-spacing:-1px}
.lvl.on{background:#f2b134;color:#fff}.lvl.on i{color:#fff}
.casebtn{width:auto;padding:0 10px;border-radius:24px;font-size:17px;font-weight:700;color:#8a5cc9}
.faint .outline{stroke:#e3cbb0}.faint .body{stroke:#f6e9da}
.lvpop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#fff;border-radius:24px;padding:14px 26px;font-size:28px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:25;pointer-events:none;text-align:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.lvpop small{display:block;font-size:16px;font-weight:600;opacity:.7}.lvpop.show{transform:translate(-50%,-50%) scale(1)}

/* KATA */
.kata-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:4px 14px 10px}
.kpic{width:clamp(130px,38vw,210px);aspect-ratio:1;background:#fff;border-radius:30px;display:grid;place-items:center;font-size:clamp(78px,23vw,130px);box-shadow:0 6px 0 #e2c9ad;border:none;padding:0;line-height:1}
.kpic.jump{animation:jump .6s ease}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.kmsg{font-size:22px;font-weight:600;min-height:28px}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(48px,14vw,72px);aspect-ratio:1;border-radius:14px;border:3px dashed #c9a27c;background:rgba(255,255,255,.45);display:grid;place-items:center;font-size:clamp(32px,9vw,48px);font-weight:700}
.slot.next{border-color:#e8665a;animation:breathe 1.2s ease-in-out infinite}
.slot.filled{border-style:solid;background:#fff;border-color:currentColor;animation:popin .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.ktiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:460px}
.ktile{--tw:clamp(52px,15vw,72px)}
.ktile.used{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.bigbtn{border:none;background:#4caf6a;color:#fff;font-size:24px;font-weight:700;padding:12px 30px;border-radius:40px;box-shadow:0 5px 0 #2f8a4b}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2f8a4b}
.bigbtn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e2c9ad}
.kprog{font-size:15px;opacity:.7}
[hidden]{display:none!important}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(70,45,28,.55);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:20;padding:16px}
.modal.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scene{width:min(86vw,400px,calc(70dvh*.78));aspect-ratio:3/4;border-radius:28px;border:8px solid #fff;overflow:hidden;position:relative;background:linear-gradient(#a9d8ee,#dff0f5 62%);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:popin .4s cubic-bezier(.3,1.4,.5,1)}
.sun{position:absolute;top:-30px;right:-20px;width:120px;height:120px;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 18px rgba(255,236,150,.45),0 0 0 36px rgba(255,236,150,.2)}
.cloud{position:absolute;background:#fff;border-radius:40px;height:22px;opacity:.95}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:30px;height:30px;left:12px;top:-14px}
.cloud:after{width:22px;height:22px;left:34px;top:-9px}
.hill{position:absolute;left:-20%;right:-20%;bottom:16%;height:30%;background:#a7d488;border-radius:50% 50% 0 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:#ecd9a2}
.bush{position:absolute;right:6%;bottom:16%;width:30%;height:12%;background:#6fb253;border-radius:40px 40px 10px 10px}
.animal{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);font-size:min(36vw,150px);line-height:1;border:none;background:none;padding:0;filter:drop-shadow(0 8px 4px rgba(0,0,0,.15))}
.animal svg{width:min(48vw,190px);height:auto;display:block}
.animal.boing{animation:boing .6s ease}
@keyframes boing{0%{transform:translateX(-50%) scale(1)}25%{transform:translateX(-50%) scale(1.15,.85)}50%{transform:translateX(-50%) translateY(-30px) scale(.9,1.12)}75%{transform:translateX(-50%) scale(1.05,.95)}100%{transform:translateX(-50%) scale(1)}}
.bubble{position:absolute;top:33%;right:7%;background:#fff;padding:6px 12px;border-radius:16px;font-weight:700;font-size:20px;color:#e8665a;transform:scale(0) rotate(-8deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 0 #f1c9c2}
.bubble.show{transform:scale(1) rotate(-8deg)}
.word{position:absolute;top:7%;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:4px 22px;font-size:clamp(34px,10vw,48px);font-weight:700;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.08);border:none;color:var(--ink)}
.word b{color:var(--c)}
.tap{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:14px;font-weight:600;opacity:.65}
.mbtns{display:flex;gap:14px}

.counter{position:absolute;left:5%;right:5%;top:23%;bottom:11%;display:none;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 8px}
.scene.num .counter{display:flex}.scene.num .animal,.scene.num .bubble,.scene.num .bush{display:none}
.cnt{font-size:var(--fs);border:none;background:none;position:relative;padding:2px;line-height:1;transition:transform .2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 4px 3px rgba(0,0,0,.15))}
.cnt.on{transform:scale(1.18)}
.cnt.on::after{content:attr(data-n);position:absolute;top:-6px;right:-8px;background:var(--c);color:#fff;border-radius:50%;width:26px;height:26px;font-size:16px;font-weight:700;display:grid;place-items:center;font-family:'Fredoka',sans-serif;filter:none}
.cnt.empty{opacity:.9}
.grid.num{max-width:calc(var(--tw)*5 + 30px)}
.sndbtn{position:absolute;top:6px;right:14px;width:auto;border-radius:26px;padding:0 14px 0 10px;display:flex;gap:6px;font-size:15px;font-weight:600;color:var(--ink);z-index:2}
.sndbox{background:#fff;border-radius:26px;padding:18px 20px 20px;width:min(92vw,420px);max-height:88dvh;overflow:auto;animation:popin .3s cubic-bezier(.3,1.4,.5,1);user-select:text;-webkit-user-select:text}
.sndbox h2{margin:0 0 10px;font-size:24px}
.strow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#faf1e6;border-radius:14px;margin-bottom:8px;font-size:17px;font-weight:600}
.strow b{font-weight:600;font-size:15px;white-space:nowrap}
.sttip{font-size:14.5px;line-height:1.45;margin:6px 0 14px}.sttip ul{margin:0;padding-left:18px}.sttip li{margin-bottom:6px}
.sndbox .mbtns{justify-content:center}.sndbox .bigbtn{font-size:18px;padding:10px 22px}
.instbtn{position:absolute;top:6px;left:14px;width:auto;border-radius:26px;padding:0 14px 0 10px;display:flex;gap:6px;font-size:15px;font-weight:600;color:var(--ink);z-index:2}
.sttip ol{margin:0;padding-left:20px}.sttip ol li{margin-bottom:8px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (max-width:360px){.lvl{min-width:38px;padding:0 5px}.rbtn{width:42px;height:42px}}
@media (orientation:landscape) and (min-width:700px){
  .cards{flex-direction:row}
  .cards{grid-template-columns:repeat(4,1fr);width:min(94vw,1000px)}
  .trace-wrap{flex-direction:row;gap:20px;padding:0 24px 10px}
  .stage{flex:1.1}
  .grid{max-width:calc(var(--tw)*7 + 40px);align-self:center}
  .kata-wrap{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto auto auto;column-gap:40px;align-content:center;justify-content:center}
  .kpic{grid-row:1/5}
}
</style>
</head>
<body>
<div id="app">
  <div class="bunting"></div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="balloon" style="background:#e8665a;left:8%;top:12%"></div>
    <div class="balloon" style="background:#5aa9e6;right:10%;top:22%;animation-delay:-2s"></div>
    <div class="balloon" style="background:#67b96a;left:14%;bottom:12%;animation-delay:-4s"></div>
    <button class="rbtn sndbtn" id="sndTest" aria-label="Tes suara"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#e2752b"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#e2752b" stroke-width="2.2" stroke-linecap="round"/></svg><span>Tes Suara</span></button>
    <button class="rbtn instbtn" id="instBtn" hidden aria-label="Pasang aplikasi">📲 <span>Pasang</span></button>
    <h1 class="title" id="title"></h1>
    <div class="cards">
      <button class="mcard" id="goAZ" style="--c:#3d9bd6">
        <div class="inner"><b style="color:#d9493d;transform:rotate(-8deg)">A</b><b style="color:#f0892b">B</b><b style="color:#d1a40c;transform:rotate(8deg)">C</b></div>
        <div class="lbl">Huruf Besar A–Z</div>
      </button>
      <button class="mcard" id="goaz" style="--c:#8a5cc9">
        <div class="inner"><b style="color:#27885a;transform:rotate(-8deg)">a</b><b style="color:#1f8fa3">b</b><b style="color:#2a62b8;transform:rotate(8deg)">c</b></div>
        <div class="lbl">Huruf Kecil a–z</div>
      </button>
      <button class="mcard" id="go09" style="--c:#4caf6a">
        <div class="inner"><b style="color:#e2752b;transform:rotate(-8deg)">1</b><b style="color:#2a62b8">2</b><b style="color:#a8327a;transform:rotate(8deg)">3</b></div>
        <div class="lbl">Angka 0–9</div>
      </button>
      <button class="mcard" id="goKata" style="--c:#e9b31f">
        <div class="inner"><b style="font-size:clamp(28px,7.5vw,54px);color:#a8327a">B</b><b style="font-size:clamp(28px,7.5vw,54px);color:#d9493d">O</b><b style="font-size:clamp(28px,7.5vw,54px);color:#2a62b8">L</b><b style="font-size:clamp(28px,7.5vw,54px);color:#27885a">A</b></div>
        <div class="lbl">Susun Kata</div>
      </button>
    </div>
    <div class="mascot">🐰</div>
  </section>

  <!-- TRACE -->
  <section id="trace" class="screen">
    <div class="topbar">
      <button class="rbtn" data-home aria-label="Beranda"></button>
      <div class="levels" data-levels="t"></div>
      <div class="spacer"></div>
      <button class="rbtn casebtn" data-case aria-label="Huruf besar/kecil">ABC</button>
      <button class="rbtn" id="tSpeak" aria-label="Dengar"></button>
    </div>
    <div class="trace-wrap">
      <div class="stage">
        <svg id="tsvg" viewBox="-14 -12 128 164"></svg>
        <div class="hintpill" id="hint">Ikuti titik-titik dengan jarimu ✋</div>
        <div class="bunny" id="bunny">🐰</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- KATA -->
  <section id="kata" class="screen">
    <div class="topbar">
      <button class="rbtn" data-home aria-label="Beranda"></button>
      <div class="levels" data-levels="k"></div>
      <div class="spacer"></div>
      <button class="rbtn casebtn" data-case aria-label="Huruf besar/kecil">ABC</button>
      <button class="rbtn" id="kSpeak" aria-label="Dengar"></button>
    </div>
    <div class="kata-wrap">
      <button class="kpic" id="kpic"></button>
      <div class="kmsg" id="kmsg"></div>
      <div class="kprog" id="kprog"></div>
      <div class="slots" id="slots"></div>
      <div class="ktiles" id="ktiles"></div>
      <button class="bigbtn" id="knext" hidden>Lanjut ➜</button>
    </div>
  </section>

  <div class="grass"></div>
</div>

<!-- KARTU HADIAH -->
<div class="modal" id="modal">
  <div class="scene" id="scene">
    <div class="sun"></div>
    <div class="cloud" style="width:70px;left:10%;top:22%"></div>
    <div class="cloud" style="width:60px;left:58%;top:30%;transform:scale(.8)"></div>
    <div class="hill"></div>
    <div class="ground"></div>
    <div class="bush"></div>
    <button class="word" id="word"></button>
    <button class="animal" id="animal"></button>
    <div class="bubble" id="bubble"></div>
    <div class="counter" id="counter"></div>
    <div class="tap" id="taptxt">Ketuk gambarnya!</div>
  </div>
  <div class="mbtns">
    <button class="bigbtn alt" id="again">↺ Ulangi</button>
    <button class="bigbtn" id="next">Lanjut ➜</button>
  </div>
</div>

<div class="modal" id="sndModal"><div class="sndbox">
  <h2>🔊 Tes Suara</h2>

    const fp=el('path',{d:pd,class:'fill',stroke:color},gF);
    const len=fp.getTotalLength(),samples=[];
    for(let l=0;l<len;l+=1){const p=fp.getPointAtLength(l);samples.push({x:p.x,y:p.y,l})}
    const e=fp.getPointAtLength(len);samples.push({x:e.x,y:e.y,l:len});
    if(lv.dots)for(let l=0;l<=len;l+=lv.dots){const p=fp.getPointAtLength(l);el('circle',{cx:p.x,cy:p.y,r:1.9,class:'dot'},gD)}
    fp.style.strokeDasharray=`${len} ${len+20}`;fp.style.strokeDashoffset=len;fp.style.visibility='hidden';
    return {fp,len,samples,idx:0};
  });
  const arrow=el('path',{d:'M-5 -5 L4 0 L-5 5',fill:'none',stroke:color,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round',class:'arrow'},svg);
  const guide=el('g',{class:'guide'},svg);
  el('circle',{r:9,class:'pulse',stroke:color},guide);
  el('circle',{r:9,class:'ring',stroke:color},guide);
  const num=el('text',{fill:color,y:.5},guide);
  T={strokes,si:0,guide,num,arrow,gB,g,complete:false,tol:lv.tol,showArrow:lv.arrow};
  refreshGrid();renderTrace();
}
function renderTrace(){
  if(!T)return;
  T.strokes.forEach(s=>{const l=s.samples[s.idx].l;s.fp.style.strokeDashoffset=s.len-l;s.fp.style.visibility=s.idx>0?'visible':'hidden'});
  if(T.complete){T.guide.style.display='none';T.arrow.style.display='none';return}
  const s=T.strokes[T.si],p=s.samples[s.idx];
  T.guide.setAttribute('transform',`translate(${p.x} ${p.y})`);
  T.num.textContent=T.strokes.length>1?T.si+1:'';
  const a=s.samples[Math.min(s.idx+16,s.samples.length-1)],b=s.samples[Math.min(s.idx+22,s.samples.length-1)];
  if(T.showArrow&&s.samples.length-1-s.idx>24&&(b.x!==a.x||b.y!==a.y)){const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;T.arrow.style.display='';T.arrow.setAttribute('transform',`translate(${b.x} ${b.y}) rotate(${ang})`)}else T.arrow.style.display='none';
}
function toSvg(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function advance(p){
  const s=T.strokes[T.si];let best=-1;const max=Math.min(s.samples.length-1,s.idx+LOOK);
  for(let i=s.idx;i<=max;i++)if(dist(p,s.samples[i])<T.tol)best=i;
  if(best>s.idx){
    const before=s.idx;s.idx=best;
    if(Math.floor(best/9)>Math.floor(before/9))pop(Math.floor(best/9));
    if(s.idx>=s.samples.length-3){s.idx=s.samples.length-1;T.si++;
      if(T.si>=T.strokes.length){finish();return false}
      ding();renderTrace();return false;
    }
    renderTrace();
  }
  return true;
}
svg.addEventListener('pointerdown',e=>{
  if(!T||T.complete)return;ac();e.preventDefault();
  const s=T.strokes[T.si],p=toSvg(e);
  if(dist(p,s.samples[s.idx])<T.tol+10){tracing=true;$('hint').style.opacity=0;try{svg.setPointerCapture(e.pointerId)}catch(_){}advance(p)}
  else{T.guide.querySelector('.ring').animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:400});tone(330,.1,'triangle',.06)}
});
svg.addEventListener('pointermove',e=>{
  if(!tracing||!T||T.complete)return;e.preventDefault();
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(const ev of evs){if(!advance(toSvg(ev))){tracing=false;break}}
});
['pointerup','pointercancel','pointerleave'].forEach(t=>svg.addEventListener(t,()=>tracing=false));

function finish(){
  T.complete=true;tracing=false;renderTrace();
  svg.classList.add('done');
  const b=T.gB.getBBox(),cx=b.x+b.width/2,ey=b.y+b.height*.4;
  const f=el('g',{},svg);f.setAttribute('transform',`translate(${cx} ${ey})`);
  const face=el('g',{class:'face'},f);
  el('circle',{cx:-19,cy:15,r:5,fill:'#f39aa6',opacity:.75},face);el('circle',{cx:19,cy:15,r:5,fill:'#f39aa6',opacity:.75},face);
  [-11,11].forEach(x=>{const lid=el('g',{class:'lid'},face);el('circle',{cx:x,cy:0,r:10,fill:'#fff',stroke:'#3b2416','stroke-width':2.2},lid);el('circle',{cx:x+2,cy:1.5,r:5,fill:'#2a1a10'},lid);el('circle',{cx:x+3.6,cy:-.4,r:1.6,fill:'#fff'},lid)});
  el('path',{d:'M-9 14 Q0 27 9 14 Z',fill:'#8a2e2e',stroke:'#3b2416','stroke-width':1.8,'stroke-linejoin':'round'},face);
  el('path',{d:'M-4.5 20.5 Q0 17 4.5 20.5 Q0 24 -4.5 20.5Z',fill:'#f07a8a'},face);
  $('bunny').classList.add('show');
  confetti();chime();
  const key=CFG.c+cur;done[key]=Math.max(done[key]||0,CFG.t);saveDone();refreshGrid();
  setTimeout(()=>say(`${ITEM(cur).n}!`),350);
  setTimeout(()=>{if(T&&T.complete)openCard(cur)},1900);
}

// ---------- KARTU ----------
function openCard(ch){
  if(/\d/.test(ch))return openNumCard(ch);
  $('scene').classList.remove('num');$('taptxt').textContent='Ketuk gambarnya!';
  const d=L[ch],c=colorOf(ch);
  $('scene').style.setProperty('--c',c);
  const w=$('word');const ww=CFG.c==='l'?d.w.toLowerCase():d.w;w.innerHTML=`<b>${ww[0]}</b>${ww.slice(1)}`;w.style.setProperty('--c',c);
  $('animal').innerHTML=d.e;$('bubble').textContent=d.snd;$('bubble').classList.remove('show');
  $('modal').classList.add('show');
  setTimeout(()=>say(`${d.n}, untuk ${d.w}`),250);
}
function openNumCard(ch){
  const d=NUM[ch],c=colorOf(ch),n=+ch,sc=$('scene');
  sc.classList.add('num');sc.style.setProperty('--c',c);
  const w=$('word');w.innerHTML=`<b>${ch}</b> · ${d.n}`;w.style.setProperty('--c',c);
  const box=$('counter');box.innerHTML='';let counted=0;
  box.style.setProperty('--fs',n===0?'110px':n<=2?'78px':n<=4?'64px':n<=6?'54px':'46px');
  if(n===0){const b=document.createElement('button');b.className='cnt empty';b.textContent=d.e;b.onclick=()=>{boing();say('nol, tidak ada apa-apa')};box.appendChild(b);$('taptxt').textContent='Piringnya kosong!'}
  else{$('taptxt').textContent='Ketuk dan hitung!';
    for(let i=0;i<n;i++){const b=document.createElement('button');b.className='cnt';b.textContent=d.e;
      b.onclick=()=>{if(b.classList.contains('on')){say(b.dataset.n);return}counted++;b.dataset.n=counted;b.classList.add('on');pop(counted*2);say(NUM[counted].n);
        if(counted===n)setTimeout(()=>{chime();confetti(80);say(`${d.n} ${d.w}!`)},700)};box.appendChild(b)}}
  $('modal').classList.add('show');
  setTimeout(()=>say(n===0?'nol':`${d.n}. Ayo hitung!`),250);
}
function closeModal(){$('modal').classList.remove('show')}
$('animal').onclick=()=>{const a=$('animal'),b=$('bubble');a.classList.remove('boing');void a.offsetWidth;a.classList.add('boing');boing();b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1300);say(L[cur].w)};
$('word').onclick=()=>say(/\d/.test(cur)?NUM[cur].n:L[cur].w);
$('again').onclick=()=>{closeModal();loadLetter(cur)};
$('next').onclick=()=>{closeModal();const it=ITEMS(),n=it[(it.indexOf(cur)+1)%it.length];loadLetter(n);say(ITEM(n).n)};
$('tSpeak').onclick=()=>{ac();const d=ITEM(cur);say(/\d/.test(cur)?d.n:`${d.n}. ${d.n}, untuk ${d.w}`)};

// ---------- KATA ----------
const K={i:0,word:'',pos:0};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function loadKata(i){
  const set=WORDS[CFG.k];
  K.i=(i+set.list.length)%set.list.length;const [w,e]=set.list[K.i];K.word=w;K.pos=0;
  const pic=$('kpic');pic.textContent=e;pic.classList.remove('jump');
  $('kprog').textContent=`Tingkat ${CFG.k} · ${K.i+1} / ${set.list.length}`;$('kmsg').textContent='Susun hurufnya!';$('knext').hidden=true;
  const sl=$('slots');sl.innerHTML='';[...w].forEach(()=>{const d=document.createElement('div');d.className='slot';sl.appendChild(d)});
  const pool=ABC.filter(c=>!w.includes(c));const extra=shuffle(pool.slice()).slice(0,set.extra);
  const tl=$('ktiles');tl.innerHTML='';
  shuffle([...w,...extra]).forEach(ch=>{const b=document.createElement('button');b.className='tile ktile';b.textContent=disp(ch);b.dataset.l=ch;b.style.setProperty('--c',colorOf(ch));b.onclick=()=>tapTile(b);tl.appendChild(b)});
  markNext();
}
function markNext(){[...$('slots').children].forEach((s,i)=>s.classList.toggle('next',i===K.pos))}
function tapTile(b){
  ac();if(K.pos>=K.word.length)return;const need=K.word[K.pos];
  if(b.dataset.l===need){
    const s=$('slots').children[K.pos];s.textContent=disp(need);s.style.color=colorOf(need);s.classList.add('filled');
    b.classList.add('used');K.pos++;pop(K.pos*2);say(L[need].n);markNext();
    if(K.pos===K.word.length){setTimeout(()=>{confetti();chime();say(K.word.toLowerCase());$('kmsg').textContent='Hebat! 🎉';$('knext').hidden=false;$('kpic').classList.add('jump')},450)}
  }else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');buzz();$('kmsg').textContent='Coba lagi ya! 😊'}
}
$('knext').onclick=()=>loadKata(K.i+1);
$('kpic').onclick=()=>{ac();const p=$('kpic');p.classList.remove('jump');void p.offsetWidth;p.classList.add('jump');say(K.word.toLowerCase())};
$('kSpeak').onclick=()=>{ac();say(K.word.toLowerCase())};

// ---------- CONFETTI ----------
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function rs(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r}
addEventListener('resize',rs);rs();
function confetti(n=150){const C=["#e8665a","#f2b134","#67b96a","#5aa9e6","#b07ad9","#f39aa6"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.42,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:Math.random()*7+5,c:C[i%C.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,circ:Math.random()<.4});
  if(!raf)raf=requestAnimationFrame(loop)}
function loop(){const r=devicePixelRatio||1;cx.setTransform(r,0,0,r,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){p.vy+=.38;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.circ){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  parts=parts.filter(p=>p.y<innerHeight+30);raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

cur='A';buildGrid();refreshLevels();refreshCase();
$('sndTest').onclick=()=>{$('sndModal').classList.add('show');runSoundTest()};
$('stAgain').onclick=runSoundTest;
$('stClose').onclick=()=>$('sndModal').classList.remove('show');
// ---------- PWA: offline + pasang di layar utama ----------
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!standalone)$('instBtn').hidden=false});
addEventListener('appinstalled',()=>{$('instBtn').hidden=true;deferredPrompt=null});
if(isIOS&&!standalone&&location.protocol==='https:')$('instBtn').hidden=false;
$('instBtn').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;$('instBtn').hidden=true;return}
  $('instSteps').innerHTML=isIOS
    ?'<li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.</li>'
    :'<li>Buka halaman ini di <b>Google Chrome</b>.</li><li>Ketuk menu <b>⋮</b> di kanan atas.</li><li>Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.</li>';
  $('instModal').classList.add('show')};
$('instClose').onclick=()=>$('instModal').classList.remove('show');
// buka langsung via #trace / #kata (untuk uji)
if(location.hash==='#trace'){show('trace');loadLetter('A')}
if(location.hash==='#kata'){show('kata');loadKata(0)}
if(location.hash==='#trace-n'){CFG.c='N';refreshCase();buildGrid();show('trace');loadLetter('3')}
if(location.hash==='#trace-l'){CFG.c='l';buildGrid();show('trace');loadLetter('A')}
window.__game={get T(){return T},L,LOW,NUM,openTrace,loadLetter,finish:()=>finish(),openCard};
})();
